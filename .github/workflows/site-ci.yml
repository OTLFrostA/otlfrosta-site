name: Website CI/CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore published demo assets
        id: demo-cache
        uses: actions/cache@v4
        with:
          path: public/demo
          key: demo-v2.1.1-${{ hashFiles('scripts/generate-examples.cjs', 'scripts/prepare-demo-capture.cjs') }}
      - name: Check out pinned published extension source
        if: steps.demo-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: OTLFrostA/gemini-exporter
          ref: 67c7dc5eb5e4d1cac2a8cf0171bf684b1474b152
          path: .exporter
          persist-credentials: false
      - name: Install pinned renderer dependencies
        if: steps.demo-cache.outputs.cache-hit != 'true'
        working-directory: .exporter
        run: npm ci
      - name: Generate actual sample exports
        if: steps.demo-cache.outputs.cache-hit != 'true'
        run: |
          command -v pdftoppm >/dev/null || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          node -r ./.exporter/tests/ts_register.js scripts/generate-examples.cjs .exporter public/demo
      - name: Build extension and install sandboxed Chromium
        if: steps.demo-cache.outputs.cache-hit != 'true'
        working-directory: .exporter
        run: |
          npm run build
          npx playwright install --with-deps chromium
          bash scripts/setup-playwright-sandbox.sh
      - name: Align screenshot fixture with the published five-format UI
        if: steps.demo-cache.outputs.cache-hit != 'true'
        run: node scripts/prepare-demo-capture.cjs
      - name: Capture real extension UI using synthetic fixture conversations
        if: steps.demo-cache.outputs.cache-hit != 'true'
        working-directory: .exporter
        env:
          CAPTURE_README_SCREENSHOTS: '1'
        run: |
          npx playwright test tests/e2e/readme_screenshots.spec.ts --workers=1
          cp store_assets/screenshot_1_1280x800.png ../public/demo/workbench.png
          cp store_assets/screenshot_popup_v2.png ../public/demo/popup.png
      - name: Validate demo artifacts
        run: node scripts/check-demo.mjs
      - name: Validate UTM script syntax
        run: node --check public/utm.js && node --check public/analytics.js && node --test scripts/analytics.test.mjs
      - name: Validate deployed website
        run: node scripts/check-site.mjs
      - name: Upload validated demo assets
        uses: actions/upload-artifact@v4
        with:
          name: released-demo-assets
          path: public/demo/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: otlfrosta-web-production
      cancel-in-progress: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Download validated demo assets
        uses: actions/download-artifact@v4
        with:
          name: released-demo-assets
          path: public/demo
      - name: Verify deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the production environment secrets."
            exit 1
          fi
      - name: Deploy main to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=otlfrosta-web --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
