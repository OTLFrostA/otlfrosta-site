<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-labelledby="title desc">
<title id="title">Browser-first local processing</title>
<desc id="desc">A Gemini session supplies the conversation to your browser, which processes it and creates local files, with no exporter server.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f3f6fc"/><stop offset="1" stop-color="#eef3ff"/></linearGradient>
<linearGradient id="node" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#e9efff"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect x="0" y="0" width="680" height="420" rx="18" fill="url(#bg)"/>
<ellipse cx="365" cy="207" rx="210" ry="104" fill="#b5c7f4" opacity=".14" filter="url(#glow)"/>
<text x="36" y="48" fill="#3159d5" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">LOCAL-ONLY EXPORT</text>
<rect x="34" y="109" width="160" height="190" rx="16" stroke="#c5d1e6" fill="#ffffff"/>
<rect x="47" y="124" width="134" height="42" rx="9" fill="#eef3ff"/>
<path d="M62 145h15m-7-7v14" stroke="#3159d5" stroke-width="2.2" stroke-linecap="round"/>
<text x="88" y="150" fill="#18233a" font-family="Arial,sans-serif" font-size="16" font-weight="700">Gemini</text>
<text x="54" y="218" fill="#526176" font-family="Arial,sans-serif" font-size="15">Your existing</text>
<text x="54" y="241" fill="#526176" font-family="Arial,sans-serif" font-size="15">browser session</text>
<path d="M210 199h43m-11-10 11 10-11 10" fill="none" stroke="#3159d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="272" y="96" width="190" height="216" rx="18" fill="url(#node)" stroke="#a3b8ed" stroke-width="1.5"/>
<rect x="292" y="119" width="150" height="112" rx="10" fill="#ffffff" stroke="#c5d1e6"/>
<rect x="307" y="136" width="57" height="9" rx="4.5" fill="#3159d5"/>
<rect x="307" y="158" width="120" height="6" rx="3" fill="#b5c3db"/>
<rect x="307" y="173" width="102" height="6" rx="3" fill="#b5c3db"/>
<rect x="307" y="188" width="113" height="6" rx="3" fill="#b5c3db"/>
<circle cx="427" cy="142" r="5" fill="#15805d"/>
<text x="367" y="260" text-anchor="middle" fill="#18233a" font-family="Arial,sans-serif" font-size="17" font-weight="700">Browser processing</text>
<text x="367" y="282" text-anchor="middle" fill="#526176" font-family="Arial,sans-serif" font-size="13">On your device</text>
<path d="M478 199h32m-11-10 11 10-11 10" fill="none" stroke="#3159d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="526" y="109" width="122" height="190" rx="16" fill="#eaf7f0" stroke="#95c9ad"/>
<path d="M545 170v-36h30l9 10h43v26" stroke="#18734e" stroke-width="3" fill="none" stroke-linejoin="round"/>
<rect x="545" y="155" width="83" height="59" rx="7" fill="#ffffff" stroke="#95c9ad"/>
<path d="M563 174h49m-49 10h33m-33 10h42" stroke="#599b7b" stroke-linecap="round" stroke-width="3"/>
<text x="587" y="246" text-anchor="middle" fill="#166344" font-family="Arial,sans-serif" font-size="16" font-weight="700">Local</text>
<text x="587" y="267" text-anchor="middle" fill="#166344" font-family="Arial,sans-serif" font-size="16" font-weight="700">files</text>
<rect x="220" y="346" width="248" height="41" rx="20.5" fill="#e7f6ee" stroke="#95c9ad"/>
<circle cx="247" cy="367" r="6" fill="#15805d"/>
<text x="267" y="372" fill="#166344" font-family="Arial,sans-serif" font-size="15" font-weight="700">No upload to our servers</text>
</svg>